services:
  sebrae-scraper:
    build: .
    container_name: sebrae_scraper
    restart: "no"

    # Environment variables from .env file
    env_file:
      - .env

    # Mount volumes for persistence
    volumes:
      - scraper_data:/app/data

    # Environment variable to override data location
    environment:
      - CHECKED_URLS_FILE=/app/data/checked_urls.json
      - LOG_LEVEL=INFO

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scraper_data:
